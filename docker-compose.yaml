services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME: "http://localhost:8080"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
      openldap:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
    environment:
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-local-secret
      AUTH_FERNET_KEY: D-eX02wALHUJeFP2nvrtjjDBCgYfiQDK98NoKQouwbI=
      FRONTEND_URL: http://localhost:3000
      REDIRECT_URI: http://localhost:8000/auth/callback
      REPORTS_API_URL: http://report-api:8001
      NO_PROXY: "localhost,127.0.0.1,airflow-apiserver,airflow-scheduler,airflow-dag-processor,airflow-db,clickhouse,crm-db,telemetry-db,report-api,keycloak,minio"
      no_proxy: "localhost,127.0.0.1,airflow-apiserver,airflow-scheduler,airflow-dag-processor,airflow-db,clickhouse,crm-db,telemetry-db,report-api,keycloak,minio"
    volumes:
      - ./bionicpro-auth/app:/app/app
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      REACT_APP_AUTH_URL: http://localhost:8000

  crm-db:
    image: postgres:18
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "5434:5432"
    volumes:
      - ./demo-data/crm.sql:/docker-entrypoint-initdb.d/init.sql

  telemetry-db:
    image: postgres:18
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    ports:
      - "5435:5432"
    volumes:
      - ./demo-data/telemetry.sql:/docker-entrypoint-initdb.d/init.sql

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.25
    environment:
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "8123:8123"
      - "9000:9000"

  airflow-db:
    image: postgres:18
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5436:5432"

  airflow-init:
    build:
      context: ./airflow
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.get_host_ip_address
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__API__SECRET_KEY: "8256352cdb9be8693b42e3fc44117f3671cbc6c7175e86a97a063d6896b4f7f8d01730cfb6921fe8f68e4c4a59026cc4f9b81d32089de7ff5381550f92c0279e"
      AIRFLOW__API_AUTH__JWT_SECRET: 'd63b78cbfc6ca626f6daec41c23be76b6f4d9bbb6bca5f93f9d639af38a159c81fecec297efd51033f07203458fb1f929cc5a18792ec36fcd2f9972f36612370'

      CRM_DSN: postgresql://crm:crm@crm-db:5432/crm
      TELEMETRY_DSN: postgresql://telemetry:telemetry@telemetry-db:5432/telemetry

      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse

      NO_PROXY: "localhost,127.0.0.1,airflow-apiserver,airflow-scheduler,airflow-dag-processor,airflow-db,clickhouse,crm-db,telemetry-db,report-api,keycloak,minio"
      no_proxy: "localhost,127.0.0.1,airflow-apiserver,airflow-scheduler,airflow-dag-processor,airflow-db,clickhouse,crm-db,telemetry-db,report-api,keycloak,minio"
    command: >
      bash -c "
      airflow db migrate
      "
    depends_on:
      - airflow-db

  airflow-apiserver:
    build:
      context: ./airflow
    environment: *airflow-env
    command: api-server
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8081:8080"
    depends_on:
      - airflow-init
      - clickhouse
      - crm-db
      - telemetry-db

  airflow-scheduler:
    build:
      context: ./airflow
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      - airflow-init
      - clickhouse
      - crm-db
      - telemetry-db

  airflow-dag-processor:
    build:
      context: ./airflow
    environment: *airflow-env
    command: dag-processor
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      - airflow-init
      - clickhouse
      - crm-db
      - telemetry-db

  report-api:
    build:
      context: ./report-api
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_USER: clickhouse
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: adminadmin
      S3_BUCKET: bionicpro-reports

      CDN_BASE_URL: http://localhost:8082
      CDN_SECRET: "some_secret_key"

      KEYCLOAK_ISSUER: http://localhost:8080/realms/reports-realm
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      NO_PROXY: "localhost,127.0.0.1,airflow-apiserver,airflow-scheduler,airflow-dag-processor,airflow-db,clickhouse,crm-db,telemetry-db,report-api,keycloak,minio"
      no_proxy: "localhost,127.0.0.1,airflow-apiserver,airflow-scheduler,airflow-dag-processor,airflow-db,clickhouse,crm-db,telemetry-db,report-api,keycloak,minio"
    volumes:
      - ./report-api:/app
    ports:
      - "8001:8001"
    depends_on:
      - clickhouse
      - keycloak

  minio:
    image: minio/minio:latest

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminadmin
      NO_PROXY: "localhost,127.0.0.1,airflow-apiserver,airflow-scheduler,airflow-dag-processor,airflow-db,clickhouse,crm-db,telemetry-db,report-api,keycloak,minio"
      no_proxy: "localhost,127.0.0.1,airflow-apiserver,airflow-scheduler,airflow-dag-processor,airflow-db,clickhouse,crm-db,telemetry-db,report-api,keycloak,minio"

    volumes:
      - minio-data:/data

    ports:
      - "9001:9001"


  minio-init:
    image: minio/mc:latest

    depends_on:
      - minio
    environment:
      NO_PROXY: "localhost,127.0.0.1,airflow-apiserver,airflow-scheduler,airflow-dag-processor,airflow-db,clickhouse,crm-db,telemetry-db,report-api,keycloak,minio"
      no_proxy: "localhost,127.0.0.1,airflow-apiserver,airflow-scheduler,airflow-dag-processor,airflow-db,clickhouse,crm-db,telemetry-db,report-api,keycloak,minio"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 admin adminadmin;
      do
        sleep 2;
      done;

      mc mb --ignore-existing local/bionicpro-reports;

      mc anonymous set download local/bionicpro-reports;
      "

  cdn:
    image: nginx:alpine

    environment:
      CDN_SECRET: "some_secret_key"
      NO_PROXY: "localhost,127.0.0.1,airflow-apiserver,airflow-scheduler,airflow-dag-processor,airflow-db,clickhouse,crm-db,telemetry-db,report-api,keycloak,minio"
      no_proxy: "localhost,127.0.0.1,airflow-apiserver,airflow-scheduler,airflow-dag-processor,airflow-db,clickhouse,crm-db,telemetry-db,report-api,keycloak,minio"

    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - nginx-cache:/var/cache/nginx

    ports:
      - "8082:80"

    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  keycloak_db_data:
  frontend_node_modules:
  minio-data:
  nginx-cache: