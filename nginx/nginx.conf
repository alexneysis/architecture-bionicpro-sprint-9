proxy_cache_path /var/cache/nginx/reports
    levels=1:2
    keys_zone=reports_cache:10m
    max_size=1g
    inactive=7d
    use_temp_path=off;


server {
    listen 80;

    location /reports/ {

        # Проверка временной CDN-ссылки
        secure_link $arg_md5,$arg_expires;

        secure_link_md5
            "$secure_link_expires$uri ${CDN_SECRET}";

        if ($secure_link = "") {
            return 403;
        }

        if ($secure_link = "0") {
            return 410;
        }


        # CDN cache
        proxy_cache reports_cache;

        # query-параметры подписи в ключ кеша не входят
        proxy_cache_key $uri;

        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;

        add_header
            X-Cache-Status
            $upstream_cache_status
            always;

        proxy_pass
            http://minio:9000/bionicpro-reports/;
    }
}